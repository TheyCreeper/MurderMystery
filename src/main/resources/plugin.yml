name: MurderMystery
version: 1.0.0
main: dev.theycreeper.murdermystery.MurderMystery
api-version: '26.3'
description: Simple MurderMystery plugin
commands:
  mmstart:
    permission: murdermystery.commands.mmstart
    description: Start a murder mystery game
    usage: /mmstart <map>
  mmstop:
    permission: murdermystery.commands.mmstop
  mmnew:
    permission: murdermystery.commands.mmnew
    description: Create a new murder mystery map
  party:
    description: Manage your party
    aliases: [p]
    usage: /party <player...> or /party <invite|accept|decline|kick> <player> or /party <leave|list|disband>